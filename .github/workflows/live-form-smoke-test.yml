name: Live questionnaire smoke test

on:
  push:
    paths:
      - '.github/workflows/live-form-smoke-test.yml'

jobs:
  submit-test-questionnaire:
    runs-on: ubuntu-latest
    steps:
      - name: Submit test questionnaire to production
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import urllib.error

          url = 'https://promoters-erickson-questionnaire.vercel.app/api/submit'
          payload = {
              'website': '',
              'answers': {
                  'program_name': 'TEST — Erickson Questionnaire Email Delivery',
                  'delivery_format': 'Online',
                  'language': 'Ελληνικά',
                  'price': 'TEST €1',
                  'payment_options': 'Όχι',
                  'available_seats': '10',
                  'campaign_goal': 'Να δημιουργήσουμε ποιοτικά leads ώστε να δουλευτούν από την ομάδα μας',
                  'registration_deadline': '2026-10-05',
                  'audience_profiles': ['Managers / Team Leaders', 'HR professionals'],
                  'motivations': ['Να αποκτήσει αναγνωρισμένη εκπαίδευση / πιστοποίηση'],
                  'objections': ['Κόστος'],
                  'previous_ads': 'Όχι',
                  'creative_assets': ['Static visuals', 'Videos'],
                  'asset_adaptation': 'Ναι',
                  'lead_sources': ['Συμπληρώνει φόρμα στο site', 'Κάποιος από την ομάδα επικοινωνεί μαζί του'],
                  'lead_storage': 'Μόνο μέσω email',
                  'lead_owner': 'TEST — Maria',
                  'enrollment_process': 'TEST — Φόρμα → επικοινωνία → ενημέρωση → εγγραφή',
                  'spam_issue': 'Οι ειδοποιήσεις από τις φόρμες του site καταλήγουν στο Spam',
                  'site_access': 'Δεν γνωρίζω',
                  'meta_account': 'Ναι',
                  'media_budget': '€500–€1.000',
                  'existing_database': ['Παλαιότερα leads'],
                  'additional_notes': 'AUTOMATED SMOKE TEST — 4 September 2026. Please ignore.'
              }
          }

          data = json.dumps(payload, ensure_ascii=False).encode('utf-8')
          req = urllib.request.Request(url, data=data, headers={'Content-Type': 'application/json'}, method='POST')
          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  body = response.read().decode('utf-8')
                  print('HTTP', response.status)
                  print(body)
                  parsed = json.loads(body)
                  if response.status != 200 or parsed.get('ok') is not True:
                      raise SystemExit('Production questionnaire submission failed')
          except urllib.error.HTTPError as exc:
              body = exc.read().decode('utf-8', errors='replace')
              print('HTTP', exc.code)
              print(body)
              raise
          PY